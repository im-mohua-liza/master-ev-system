<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<title>Master EV</title>
<style>
:root{--ink:#0b0b0b;--lime:#c6ff00;--bg:#f4f5f2;--card:#fff;--line:#e2e4de;--mute:#6b6f66;--red:#d93025;--green:#1e8e3e;--amber:#b06000}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:-.04em;padding:9px 0;white-space:nowrap}
.brand .mark{width:36px;height:36px;flex:0 0 auto}
.brand b{color:var(--lime)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:#bbb;padding:16px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button:hover{color:#fff}
nav button.on{color:var(--lime);border-bottom-color:var(--lime)}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h2{margin:0 0 14px;font-size:20px}
h3{margin:18px 0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .k{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:24px;font-weight:800;margin-top:4px}
.stat.hl{background:var(--ink);color:#fff}.stat.hl .k{color:#aaa}.stat.hl .v{color:var(--lime)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cfd2ca;border-radius:6px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lime);border-color:var(--ink)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.form .wide{grid-column:1/-1}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #cfd2ca}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:0 0 auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;background:#f0f1ec;font-size:12px;color:var(--mute);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl input,.tbl select{padding:5px 6px}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700}
.p-in{background:#e6f4ea;color:var(--green)}.p-sold{background:#eee;color:#555}.p-cx{background:#fce8e6;color:var(--red)}
.p-gst{background:var(--ink);color:var(--lime)}.p-nor{background:#e8eaed;color:#333}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 18px;font:inherit;font-weight:800;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--lime)}
.totals{margin-left:auto;max-width:340px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-size:20px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.muted{color:var(--mute)}.small{font-size:12px}
.hide{display:none!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;z-index:50;max-width:90vw}
#toast.err{background:var(--red)}
#loading{position:fixed;inset:0;background:rgba(244,245,242,.7);display:flex;align-items:center;justify-content:center;font-weight:700;z-index:40}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;overflow:auto;padding:20px 12px}
.modal .box{background:#fff;max-width:900px;margin:0 auto;border-radius:10px;padding:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}

/* invoice */
.inv{font-size:12px;color:#000;border:1px solid #000;padding:0}
.inv .ih{display:flex;justify-content:space-between;gap:12px;padding:12px;border-bottom:2px solid #000}
.inv .shop{font-size:22px;font-weight:800}
.inv .title{text-align:center;font-weight:800;font-size:15px;letter-spacing:1px;padding:6px;border-bottom:1px solid #000;background:#f2f2f2}
.inv .parties{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #000}
.inv .parties>div{padding:8px 12px}.inv .parties>div+div{border-left:1px solid #000}
.inv table{width:100%;border-collapse:collapse}
.inv th,.inv td{border:1px solid #000;padding:4px 6px;vertical-align:top}
.inv th{background:#f2f2f2;font-size:11px}
.inv td.n,.inv th.n{text-align:right;white-space:nowrap}
.inv .sub{font-size:11px;color:#333}
.inv .foot{display:grid;grid-template-columns:1.3fr 1fr;border-top:1px solid #000}
.inv .foot>div{padding:8px 12px}.inv .foot>div+div{border-left:1px solid #000}
.inv .sign{display:flex;justify-content:space-between;padding:40px 12px 10px;border-top:1px solid #000}
.inv .cxmark{color:var(--red);font-weight:800;text-align:center;font-size:18px;padding:6px;border-bottom:1px solid #000}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .modal{position:static;background:none;padding:0}
}
@media (max-width:640px){
  header{flex-direction:column;align-items:stretch;gap:0}
  .brand{padding:10px 0 0}
  .inv .parties,.inv .foot{grid-template-columns:1fr}
  .inv .parties>div+div,.inv .foot>div+div{border-left:0;border-top:1px solid #000}
}
</style>
</head>
<body>
<script>
/* Local preview only: fakes Google Sheets in the browser (localStorage) so the
   real Code.gs runs unchanged. Not used in the Google deployment. */
var MOCK_KEY = 'masterev-preview-v1';
var MOCK_DB = (function () { try { return JSON.parse(localStorage.getItem(MOCK_KEY)) || {}; } catch (e) { return {}; } })();
function mockSave() { try { localStorage.setItem(MOCK_KEY, JSON.stringify(MOCK_DB)); } catch (e) {} }
function mockSheet(name) {
  var rows = MOCK_DB[name];
  var self;
  function range(r, c, nr, nc) {
    var rg = {
      getValues: function () {
        var out = [];
        for (var i = 0; i < nr; i++) { var row = []; for (var j = 0; j < nc; j++) { var src = rows[r - 1 + i]; row.push(src && src[c - 1 + j] !== undefined ? src[c - 1 + j] : ''); } out.push(row); }
        return out;
      },
      setValues: function (vals) {
        vals.forEach(function (row, i) { var tr = rows[r - 1 + i] || (rows[r - 1 + i] = []); row.forEach(function (v, j) { tr[c - 1 + j] = v; }); });
        for (var k = 0; k < rows.length; k++) if (!rows[k]) rows[k] = [];
        mockSave(); return rg;
      },
      setFontWeight: function () { return rg; }, setBackground: function () { return rg; },
      setFontColor: function () { return rg; }, setNumberFormat: function () { return rg; }
    };
    return rg;
  }
  self = {
    getRange: function (r, c, nr, nc) { return range(r, c, nr || 1, nc || 1); },
    getDataRange: function () { var w = rows.reduce(function (a, r) { return Math.max(a, r.length); }, 0); return range(1, 1, rows.length, w); },
    appendRow: function (row) { rows.push(row.slice()); mockSave(); },
    getLastRow: function () { return rows.length; },
    getMaxRows: function () { return 1000; },
    setFrozenRows: function () {}
  };
  return self;
}
var SpreadsheetApp = {
  getActiveSpreadsheet: function () {
    return {
      getSheetByName: function (n) { return MOCK_DB[n] ? mockSheet(n) : null; },
      insertSheet: function (n) { MOCK_DB[n] = []; mockSave(); return mockSheet(n); },
      getSheets: function () { return Object.keys(MOCK_DB); },
      deleteSheet: function () {},
      getSpreadsheetTimeZone: function () { return 'local'; }
    };
  },
  getUi: function () { throw new Error('no ui in preview'); }
};
var Session = { getScriptTimeZone: function () { return 'local'; } };
var LockService = { getScriptLock: function () { return { waitLock: function () {}, releaseLock: function () {} }; } };
var ScriptApp = { getService: function () { return { getUrl: function () { return ''; } }; } };
var Utilities = {
  formatDate: function (d, tz, fmt) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return fmt.replace('yyyy', d.getFullYear()).replace('MM', p(d.getMonth() + 1)).replace('dd', p(d.getDate()))
      .replace('HH', p(d.getHours())).replace('mm', p(d.getMinutes()));
  }
};
// The demo has no AI key, so the AI scooter scan explains that instead of faking a result.
var PropertiesService = { getScriptProperties: function () { return { getProperty: function () { return null; } }; } };
var UrlFetchApp = { fetch: function () { throw new Error('AI scan is not available in the demo.'); } };

var SERVER = (function () {
/**
 * Master EV - showroom system (stock, GST billing, normal billing, reports).
 *
 * The Google Sheet this script is attached to IS the database. Every bill,
 * vehicle and stock change is written straight into its tabs, so the sheet
 * always holds the full history.
 */

const SHEETS = {
  Settings:     ['Key', 'Value'],
  Models:       ['ModelId', 'Brand', 'Model', 'Variant', 'HSN', 'GSTRate', 'CostPrice', 'SalePrice', 'Active', 'CreatedAt'],
  Stock:        ['StockId', 'ModelId', 'ModelName', 'Color', 'ChassisNo', 'MotorNo', 'BatteryNo', 'ChargerNo', 'Supplier',
                 'PurchaseInvoiceNo', 'PurchaseDate', 'CostPrice', 'Status', 'SoldInvoiceNo', 'SoldDate', 'Notes', 'CreatedAt'],
  Accessories:  ['ItemId', 'Name', 'HSN', 'GSTRate', 'Qty', 'CostPrice', 'SalePrice', 'CreatedAt', 'UpdatedAt'],
  StockLog:     ['Time', 'Kind', 'Ref', 'Change', 'Note'],
  Customers:    ['Phone', 'Name', 'Address', 'GSTIN', 'State', 'StateCode', 'FirstSeen', 'LastInvoiceNo'],
  Invoices:     ['InvoiceNo', 'BillType', 'Date', 'CustomerName', 'Phone', 'Address', 'CustomerGSTIN', 'PlaceOfSupply',
                 'StateCode', 'Taxable', 'CGST', 'SGST', 'IGST', 'RoundOff', 'Total', 'PaymentMode', 'AmountPaid',
                 'Balance', 'Status', 'Notes', 'CreatedAt'],
  InvoiceItems: ['InvoiceNo', 'Line', 'ItemType', 'RefId', 'Description', 'ChassisNo', 'MotorNo', 'BatteryNo', 'HSN',
                 'Qty', 'UnitPrice', 'GSTRate', 'Taxable', 'CGST', 'SGST', 'IGST', 'LineTotal']
};

// Columns kept as plain text so Sheets never turns them into numbers or dates.
const TEXT_COLS = {
  Settings: ['Value'],
  Stock: ['StockId', 'ModelId', 'ChassisNo', 'MotorNo', 'BatteryNo', 'ChargerNo', 'PurchaseInvoiceNo', 'SoldInvoiceNo'],
  Customers: ['Phone', 'GSTIN', 'StateCode', 'LastInvoiceNo'],
  Invoices: ['InvoiceNo', 'Phone', 'CustomerGSTIN', 'StateCode'],
  InvoiceItems: ['InvoiceNo', 'RefId', 'ChassisNo', 'MotorNo', 'BatteryNo', 'HSN'],
  Models: ['ModelId', 'HSN'],
  Accessories: ['ItemId', 'HSN']
};

const DEFAULT_SETTINGS = [
  ['ShopName', 'Master EV'],
  ['Tagline', 'Authorised Zelio Electric Scooter Dealer'],
  ['Address', 'Showroom address, City, PIN'],
  ['Phone', ''],
  ['Email', ''],
  ['GSTIN', ''],
  ['State', ''],
  ['StateCode', ''],
  ['GSTPrefix', 'MEV/GST/'],
  ['NormalPrefix', 'MEV/B/'],
  ['PricesIncludeGST', 'YES'],
  ['DefaultVehicleHSN', '8711'],
  ['DefaultVehicleGSTRate', '5'],
  ['BankDetails', ''],
  ['Terms', 'Goods once sold will not be taken back. Warranty as per manufacturer terms. Subject to local jurisdiction.']
];

/* ------------------------------------------------------------------ */
/* Entry points                                                         */
/* ------------------------------------------------------------------ */

function doGet() {
  ensureSetup_();
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle('Master EV')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

function onOpen() {
  SpreadsheetApp.getUi().createMenu('Master EV')
    .addItem('1. Set up sheets', 'setup')
    .addItem('2. Load Zelio models (optional)', 'loadZelioModels')
    .addItem('Show app link', 'showAppLink')
    .addToUi();
}

function setup() {
  ensureSetup_();
  try { SpreadsheetApp.getUi().alert('Master EV sheets are ready.'); } catch (e) { /* run from editor */ }
}

function showAppLink() {
  const url = ScriptApp.getService().getUrl();
  SpreadsheetApp.getUi().alert(url ? 'Open the app here:\n\n' + url
    : 'The app is not deployed yet. In Extensions > Apps Script, click Deploy > New deployment > Web app.');
}

/* ------------------------------------------------------------------ */
/* Sheet helpers                                                        */
/* ------------------------------------------------------------------ */

function ss_() { return SpreadsheetApp.getActiveSpreadsheet(); }

function ensureSetup_() {
  const ss = ss_();
  Object.keys(SHEETS).forEach(name => {
    let sh = ss.getSheetByName(name);
    const head = SHEETS[name];
    if (!sh) {
      sh = ss.insertSheet(name);
      sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold')
        .setBackground('#0b0b0b').setFontColor('#c6ff00');
      sh.setFrozenRows(1);
      (TEXT_COLS[name] || []).forEach(col => {
        sh.getRange(2, head.indexOf(col) + 1, sh.getMaxRows() - 1, 1).setNumberFormat('@');
      });
    }
  });
  const sh = ss.getSheetByName('Settings');
  if (sh.getLastRow() < 2) sh.getRange(2, 1, DEFAULT_SETTINGS.length, 2).setValues(DEFAULT_SETTINGS);
  const blank = ss.getSheetByName('Sheet1');
  if (blank && blank.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(blank);
}

function sheet_(name) { return ss_().getSheetByName(name); }

function tz_() { return ss_().getSpreadsheetTimeZone() || Session.getScriptTimeZone(); }

function clean_(v) {
  if (v instanceof Date) {
    const hasTime = Utilities.formatDate(v, tz_(), 'HH:mm') !== '00:00';
    return Utilities.formatDate(v, tz_(), hasTime ? 'yyyy-MM-dd HH:mm' : 'yyyy-MM-dd');
  }
  return v;
}

/** All rows of a tab as objects; each has _row (sheet row number). */
function readTable_(name) {
  const vals = sheet_(name).getDataRange().getValues();
  const head = vals.shift() || [];
  const out = [];
  vals.forEach((r, i) => {
    if (!r.some(v => v !== '')) return;
    const o = { _row: i + 2 };
    head.forEach((h, j) => { o[h] = clean_(r[j]); });
    out.push(o);
  });
  return out;
}

function append_(name, obj) {
  const head = SHEETS[name];
  sheet_(name).appendRow(head.map(h => (obj[h] === undefined || obj[h] === null) ? '' : obj[h]));
}

function appendMany_(name, objs) {
  if (!objs.length) return;
  const head = SHEETS[name];
  const sh = sheet_(name);
  const rows = objs.map(o => head.map(h => (o[h] === undefined || o[h] === null) ? '' : o[h]));
  sh.getRange(sh.getLastRow() + 1, 1, rows.length, head.length).setValues(rows);
}

function update_(name, rowNum, patch) {
  const head = SHEETS[name];
  const rng = sheet_(name).getRange(rowNum, 1, 1, head.length);
  const row = rng.getValues()[0];
  Object.keys(patch).forEach(k => {
    const i = head.indexOf(k);
    if (i >= 0) row[i] = patch[k];
  });
  rng.setValues([row]);
}

function now_() { return Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HH:mm'); }
function today_() { return Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd'); }
function id_(prefix) { return prefix + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 36).toString(36).toUpperCase(); }
function num_(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function r2_(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function str_(v) { return String(v === undefined || v === null ? '' : v).trim(); }

function withLock_(fn) {
  const lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try { return fn(); } finally { lock.releaseLock(); }
}

/* ------------------------------------------------------------------ */
/* Settings                                                             */
/* ------------------------------------------------------------------ */

function getSettings_() {
  const s = {};
  readTable_('Settings').forEach(r => { s[r.Key] = str_(r.Value); });
  return s;
}

function setSetting_(key, value) {
  const row = readTable_('Settings').find(r => r.Key === key);
  if (row) update_('Settings', row._row, { Value: String(value) });
  else append_('Settings', { Key: key, Value: String(value) });
}

function saveSettings(obj) {
  return withLock_(() => {
    DEFAULT_SETTINGS.forEach(([k]) => { if (k in obj) setSetting_(k, str_(obj[k])); });
    return getSettings_();
  });
}

/** Indian financial year label for a yyyy-MM-dd date, e.g. 2026-27. */
function fy_(dateStr) {
  const y = Number(dateStr.slice(0, 4)), m = Number(dateStr.slice(5, 7));
  const start = m >= 4 ? y : y - 1;
  return start + '-' + String((start + 1) % 100).padStart(2, '0');
}

/** Next invoice number. Each bill type has its own series that restarts every financial year. */
function nextInvoiceNo_(billType, dateStr, settings) {
  const fy = fy_(dateStr);
  const key = 'Counter_' + billType + '_' + fy;
  const n = num_(settings[key]) + 1;
  setSetting_(key, n);
  const prefix = billType === 'GST' ? (settings.GSTPrefix || 'MEV/GST/') : (settings.NormalPrefix || 'MEV/B/');
  return prefix + fy + '/' + String(n).padStart(4, '0');
}

/* ------------------------------------------------------------------ */
/* App data                                                             */
/* ------------------------------------------------------------------ */

function getBootstrap() {
  ensureSetup_();
  const strip = rows => rows.map(r => { delete r._row; return r; });
  return {
    settings: getSettings_(),
    models: strip(readTable_('Models')),
    stock: strip(readTable_('Stock')),
    accessories: strip(readTable_('Accessories')),
    dashboard: getDashboard_()
  };
}

function getDashboard_() {
  const stock = readTable_('Stock');
  const inStock = stock.filter(s => s.Status === 'In Stock');
  const byModel = {};
  inStock.forEach(s => { byModel[s.ModelName] = (byModel[s.ModelName] || 0) + 1; });
  const acc = readTable_('Accessories');
  const inv = readTable_('Invoices').filter(i => i.Status !== 'Cancelled');
  const t = today_(), m = t.slice(0, 7);
  const sum = (rows, f) => r2_(rows.reduce((a, r) => a + num_(r[f]), 0));
  const todays = inv.filter(i => String(i.Date).slice(0, 10) === t);
  const month = inv.filter(i => String(i.Date).slice(0, 7) === m);
  return {
    vehiclesInStock: inStock.length,
    stockValue: sum(inStock, 'CostPrice'),
    byModel: Object.keys(byModel).sort().map(k => ({ model: k, count: byModel[k] })),
    lowAccessories: acc.filter(a => num_(a.Qty) <= 2).map(a => ({ name: a.Name, qty: num_(a.Qty) })),
    todaySales: sum(todays, 'Total'), todayBills: todays.length,
    monthSales: sum(month, 'Total'), monthBills: month.length,
    monthGST: r2_(sum(month, 'CGST') + sum(month, 'SGST') + sum(month, 'IGST')),
    monthVehiclesSold: stock.filter(s => s.Status === 'Sold' && String(s.SoldDate).slice(0, 7) === m).length,
    pendingBalance: sum(inv.filter(i => num_(i.Balance) > 0), 'Balance'),
    recent: inv.slice(-8).reverse().map(i => ({ no: i.InvoiceNo, type: i.BillType, date: i.Date, name: i.CustomerName, total: num_(i.Total), balance: num_(i.Balance) }))
  };
}

/* ------------------------------------------------------------------ */
/* Models, vehicles, accessories                                        */
/* ------------------------------------------------------------------ */

function modelName_(m) { return [m.Brand, m.Model, m.Variant].map(str_).filter(Boolean).join(' '); }

function addModel(m) {
  return withLock_(() => {
    if (!str_(m.Model)) throw new Error('Model name is required.');
    const s = getSettings_();
    const row = {
      ModelId: id_('M'), Brand: str_(m.Brand), Model: str_(m.Model), Variant: str_(m.Variant),
      HSN: str_(m.HSN) || s.DefaultVehicleHSN || '8711',
      GSTRate: m.GSTRate === '' || m.GSTRate === undefined ? num_(s.DefaultVehicleGSTRate || 5) : num_(m.GSTRate),
      CostPrice: num_(m.CostPrice), SalePrice: num_(m.SalePrice), Active: 'YES', CreatedAt: now_()
    };
    append_('Models', row);
    return row;
  });
}

function updateModel(m) {
  return withLock_(() => {
    const row = readTable_('Models').find(r => r.ModelId === m.ModelId);
    if (!row) throw new Error('Model not found.');
    const patch = {};
    ['Brand', 'Model', 'Variant', 'HSN', 'Active'].forEach(k => { if (k in m) patch[k] = str_(m[k]); });
    ['GSTRate', 'CostPrice', 'SalePrice'].forEach(k => { if (k in m) patch[k] = num_(m[k]); });
    update_('Models', row._row, patch);
    return true;
  });
}

function addVehicle(v) {
  return withLock_(() => {
    const chassis = str_(v.ChassisNo).toUpperCase();
    if (!chassis) throw new Error('Chassis number is required.');
    const model = readTable_('Models').find(m => m.ModelId === v.ModelId);
    if (!model) throw new Error('Pick a model first.');
    if (readTable_('Stock').some(s => str_(s.ChassisNo).toUpperCase() === chassis)) {
      throw new Error('Chassis number ' + chassis + ' is already in the system.');
    }
    const row = {
      StockId: id_('V'), ModelId: model.ModelId, ModelName: modelName_(model), Color: str_(v.Color),
      ChassisNo: chassis, MotorNo: str_(v.MotorNo).toUpperCase(), BatteryNo: str_(v.BatteryNo).toUpperCase(),
      ChargerNo: str_(v.ChargerNo).toUpperCase(), Supplier: str_(v.Supplier), PurchaseInvoiceNo: str_(v.PurchaseInvoiceNo),
      PurchaseDate: str_(v.PurchaseDate) || today_(), CostPrice: v.CostPrice === '' ? num_(model.CostPrice) : num_(v.CostPrice),
      Status: 'In Stock', SoldInvoiceNo: '', SoldDate: '', Notes: str_(v.Notes), CreatedAt: now_()
    };
    append_('Stock', row);

/** Same maths as calc() in Index.html. The server result is what gets saved. */
function calc_(items, billType, inclusive, interState) {
  const t = { taxable: 0, cgst: 0, sgst: 0, igst: 0, lines: [] };
  items.forEach(it => {
    const qty = num_(it.qty), price = num_(it.unitPrice);
    const gross = r2_(qty * price);
    const rate = billType === 'GST' ? num_(it.gstRate) : 0;
    const taxable = rate && inclusive ? r2_(gross / (1 + rate / 100)) : gross;
    const tax = r2_(taxable * rate / 100);
    let c = 0, s = 0, i = 0;
    if (interState) i = tax; else { c = r2_(tax / 2); s = r2_(tax - c); }
    t.lines.push(Object.assign({}, it, { qty: qty, unitPrice: price, gstRate: rate, taxable: taxable, cgst: c, sgst: s, igst: i, lineTotal: r2_(taxable + tax) }));
    t.taxable += taxable; t.cgst += c; t.sgst += s; t.igst += i;
  });
  ['taxable', 'cgst', 'sgst', 'igst'].forEach(k => { t[k] = r2_(t[k]); });
  const exact = r2_(t.taxable + t.cgst + t.sgst + t.igst);
  t.total = Math.round(exact);
  t.roundOff = r2_(t.total - exact);
  return t;
}

function createInvoice(p) {
  return withLock_(() => {
    const billType = p.billType === 'GST' ? 'GST' : 'NORMAL';
    const s = getSettings_();
    const date = str_(p.date) || today_();
    const cust = p.customer || {};
    if (!str_(cust.name)) throw new Error('Customer name is required.');
    if (!p.items || !p.items.length) throw new Error('Add at least one item to the bill.');
    if (billType === 'GST' && !s.GSTIN) throw new Error('Add your shop GSTIN in Settings before making a GST bill.');

    const stock = readTable_('Stock');
    const acc = readTable_('Accessories');
    const items = p.items.map(it => {
      const o = {
        itemType: it.itemType, refId: str_(it.refId), description: str_(it.description), hsn: str_(it.hsn),
        qty: num_(it.qty), unitPrice: num_(it.unitPrice), gstRate: num_(it.gstRate), chassisNo: '', motorNo: '', batteryNo: ''
      };
      if (!o.description) throw new Error('Every line needs a description.');
      if (o.qty <= 0) throw new Error('Quantity must be more than zero for ' + o.description + '.');
      if (o.itemType === 'VEHICLE') {
        const v = stock.find(x => x.StockId === o.refId);
        if (!v) throw new Error('Vehicle not found in stock.');
        if (v.Status !== 'In Stock') throw new Error('Vehicle ' + v.ChassisNo + ' is already sold.');
        o.qty = 1; o.chassisNo = v.ChassisNo; o.motorNo = v.MotorNo; o.batteryNo = v.BatteryNo; o._row = v._row;
      }
      if (o.itemType === 'ACCESSORY') {
        const a = acc.find(x => x.ItemId === o.refId);
        if (!a) throw new Error('Item ' + o.description + ' not found.');
        if (num_(a.Qty) < o.qty) throw new Error('Only ' + num_(a.Qty) + ' of ' + a.Name + ' in stock.');
        o._row = a._row; o._have = num_(a.Qty);
      }
      return o;
    });
    const seen = {};
    items.forEach(o => {
      if (o.itemType === 'VEHICLE') { if (seen[o.refId]) throw new Error('Same vehicle added twice.'); seen[o.refId] = 1; }
    });
    const accUse = {};
    items.filter(o => o.itemType === 'ACCESSORY').forEach(o => { accUse[o.refId] = (accUse[o.refId] || 0) + o.qty; });
    items.filter(o => o.itemType === 'ACCESSORY').forEach(o => {
      if (accUse[o.refId] > o._have) throw new Error('Not enough ' + o.description + ' in stock.');
    });

    const custCode = str_(cust.stateCode);
    const interState = billType === 'GST' && !!custCode && !!s.StateCode && custCode !== s.StateCode;
    const inclusive = p.pricesIncludeGST !== false;
    const t = calc_(items, billType, inclusive, interState);

    const invNo = nextInvoiceNo_(billType, date, s);
    const paid = p.amountPaid === '' || p.amountPaid === undefined || p.amountPaid === null ? t.total : num_(p.amountPaid);
    const inv = {
      InvoiceNo: invNo, BillType: billType, Date: date, CustomerName: str_(cust.name), Phone: str_(cust.phone),
      Address: str_(cust.address), CustomerGSTIN: billType === 'GST' ? str_(cust.gstin).toUpperCase() : '',
      PlaceOfSupply: billType === 'GST' ? (str_(cust.state) || s.State) : '', StateCode: billType === 'GST' ? (custCode || s.StateCode) : '',
      Taxable: t.taxable, CGST: t.cgst, SGST: t.sgst, IGST: t.igst, RoundOff: t.roundOff, Total: t.total,
      PaymentMode: str_(p.paymentMode) || 'Cash', AmountPaid: paid, Balance: r2_(t.total - paid),
      Status: 'Active', Notes: str_(p.notes), CreatedAt: now_()
    };
    append_('Invoices', inv);
    appendMany_('InvoiceItems', t.lines.map((l, i) => ({
      InvoiceNo: invNo, Line: i + 1, ItemType: l.itemType, RefId: l.refId, Description: l.description,
      ChassisNo: l.chassisNo, MotorNo: l.motorNo, BatteryNo: l.batteryNo, HSN: l.hsn, Qty: l.qty, UnitPrice: l.unitPrice,
      GSTRate: l.gstRate, Taxable: l.taxable, CGST: l.cgst, SGST: l.sgst, IGST: l.igst, LineTotal: l.lineTotal
    })));

    items.forEach(o => {
      if (o.itemType === 'VEHICLE') {
        update_('Stock', o._row, { Status: 'Sold', SoldInvoiceNo: invNo, SoldDate: date });
        append_('StockLog', { Time: now_(), Kind: 'Vehicle sold', Ref: o.chassisNo, Change: -1, Note: invNo });
      }
    });
    Object.keys(accUse).forEach(id => {
      const a = items.find(o => o.refId === id);
      update_('Accessories', a._row, { Qty: a._have - accUse[id], UpdatedAt: now_() });
      append_('StockLog', { Time: now_(), Kind: 'Item sold', Ref: a.description, Change: -accUse[id], Note: invNo });
    });

    if (inv.Phone) {
      const c = readTable_('Customers').find(r => str_(r.Phone) === inv.Phone);
      const crow = { Phone: inv.Phone, Name: inv.CustomerName, Address: inv.Address, GSTIN: str_(cust.gstin).toUpperCase(),
        State: str_(cust.state), StateCode: custCode, LastInvoiceNo: invNo };
      if (c) update_('Customers', c._row, crow);
      else append_('Customers', Object.assign(crow, { FirstSeen: date }));
    }
    return getInvoice(invNo);
  });
}

function getInvoice(invNo) {
  const inv = readTable_('Invoices').find(r => r.InvoiceNo === invNo);
  if (!inv) throw new Error('Invoice ' + invNo + ' not found.');
  delete inv._row;
  const items = readTable_('InvoiceItems').filter(r => r.InvoiceNo === invNo).map(r => { delete r._row; return r; });
  return { invoice: inv, items: items, settings: getSettings_() };
}

function listInvoices(f) {
  f = f || {};
  const q = str_(f.q).toLowerCase();
  let rows = readTable_('Invoices');
  if (f.type) rows = rows.filter(r => r.BillType === f.type);
  if (f.month) rows = rows.filter(r => String(r.Date).slice(0, 7) === f.month);
  if (q) {
    const chassisHits = {};
    readTable_('InvoiceItems').forEach(it => {
      if ((str_(it.ChassisNo) + ' ' + str_(it.MotorNo) + ' ' + str_(it.BatteryNo)).toLowerCase().indexOf(q) >= 0) chassisHits[it.InvoiceNo] = 1;
    });
    rows = rows.filter(r => chassisHits[r.InvoiceNo] ||
      [r.InvoiceNo, r.CustomerName, r.Phone, r.CustomerGSTIN].join(' ').toLowerCase().indexOf(q) >= 0);
  }
  return rows.reverse().slice(0, 500).map(r => { delete r._row; return r; });
}

function recordPayment(invNo, amount, mode) {
  return withLock_(() => {
    const inv = readTable_('Invoices').find(r => r.InvoiceNo === invNo);
    if (!inv) throw new Error('Invoice not found.');
    if (inv.Status === 'Cancelled') throw new Error('This bill is cancelled.');
    const amt = num_(amount);
    if (amt <= 0) throw new Error('Enter an amount.');
    const paid = r2_(num_(inv.AmountPaid) + amt);
    const mode2 = str_(mode) && str_(mode) !== str_(inv.PaymentMode) ? str_(inv.PaymentMode) + ' + ' + str_(mode) : inv.PaymentMode;
    update_('Invoices', inv._row, { AmountPaid: paid, Balance: r2_(num_(inv.Total) - paid), PaymentMode: mode2 });
    return getInvoice(invNo);
  });
}

function cancelInvoice(invNo, reason) {
  return withLock_(() => {
    const inv = readTable_('Invoices').find(r => r.InvoiceNo === invNo);
    if (!inv) throw new Error('Invoice not found.');
    if (inv.Status === 'Cancelled') throw new Error('Already cancelled.');
    update_('Invoices', inv._row, { Status: 'Cancelled', Notes: (str_(inv.Notes) + ' | Cancelled ' + now_() + ': ' + str_(reason)).replace(/^ \| /, '') });
    const items = readTable_('InvoiceItems').filter(r => r.InvoiceNo === invNo);
    const stock = readTable_('Stock');
    const acc = readTable_('Accessories');
    items.forEach(it => {
      if (it.ItemType === 'VEHICLE') {
        const v = stock.find(s => s.StockId === it.RefId);
        if (v && v.SoldInvoiceNo === invNo) {
          update_('Stock', v._row, { Status: 'In Stock', SoldInvoiceNo: '', SoldDate: '' });
          append_('StockLog', { Time: now_(), Kind: 'Vehicle returned', Ref: v.ChassisNo, Change: 1, Note: 'Cancelled ' + invNo });
        }
      }
      if (it.ItemType === 'ACCESSORY') {
        const a = acc.find(x => x.ItemId === it.RefId);
        if (a) {
          a.Qty = num_(a.Qty) + num_(it.Qty);
          update_('Accessories', a._row, { Qty: a.Qty, UpdatedAt: now_() });
          append_('StockLog', { Time: now_(), Kind: 'Item returned', Ref: a.Name, Change: num_(it.Qty), Note: 'Cancelled ' + invNo });
        }
      }
    });
    return getInvoice(invNo);
  });
}

function getMonthReport(month) {
  const m = str_(month) || today_().slice(0, 7);
  const all = readTable_('Invoices').filter(r => String(r.Date).slice(0, 7) === m);
  const active = all.filter(r => r.Status !== 'Cancelled');
  const nos = {};
  active.forEach(r => { nos[r.InvoiceNo] = r; });
  const sum = (rows, f) => r2_(rows.reduce((a, r) => a + num_(r[f]), 0));
  const byType = type => {
    const rows = active.filter(r => r.BillType === type);
    return { bills: rows.length, taxable: sum(rows, 'Taxable'), cgst: sum(rows, 'CGST'), sgst: sum(rows, 'SGST'), igst: sum(rows, 'IGST'), total: sum(rows, 'Total') };
  };
  const hsn = {};
  readTable_('InvoiceItems').forEach(it => {
    const inv = nos[it.InvoiceNo];
    if (!inv || inv.BillType !== 'GST') return;
    const k = str_(it.HSN) + '|' + num_(it.GSTRate);
    const h = hsn[k] || (hsn[k] = { hsn: str_(it.HSN), rate: num_(it.GSTRate), qty: 0, taxable: 0, cgst: 0, sgst: 0, igst: 0, total: 0 });
    h.qty += num_(it.Qty); h.taxable += num_(it.Taxable); h.cgst += num_(it.CGST); h.sgst += num_(it.SGST); h.igst += num_(it.IGST); h.total += num_(it.LineTotal);
  });
  const gstRows = active.filter(r => r.BillType === 'GST');
  return {
    month: m,
    gst: byType('GST'),
    normal: byType('NORMAL'),
    cancelled: all.length - active.length,
    b2b: gstRows.filter(r => str_(r.CustomerGSTIN)).map(r => ({ no: r.InvoiceNo, date: r.Date, name: r.CustomerName, gstin: r.CustomerGSTIN, taxable: num_(r.Taxable), tax: r2_(num_(r.CGST) + num_(r.SGST) + num_(r.IGST)), total: num_(r.Total) })),
    b2cCount: gstRows.filter(r => !str_(r.CustomerGSTIN)).length,
    hsn: Object.keys(hsn).sort().map(k => { const h = hsn[k]; ['taxable', 'cgst', 'sgst', 'igst', 'total'].forEach(f => { h[f] = r2_(h[f]); }); return h; }),
    payments: (() => {
      const p = {};
      active.forEach(r => { const k = str_(r.PaymentMode) || 'Cash'; p[k] = r2_((p[k] || 0) + num_(r.AmountPaid)); });
      return Object.keys(p).map(k => ({ mode: k, amount: p[k] }));
    })()
  };
}

/* ------------------------------------------------------------------ */
/* AI scooter scan: photo of the scooter (+ optional photo of the       */
/* chassis plate) -> model, colour and numbers, for adding to stock.   */
/* Needs an Anthropic API key in Project Settings > Script properties  */
/* under the name ANTHROPIC_API_KEY. The key never goes in the code.   */
/* ------------------------------------------------------------------ */

const AI_MODEL = 'claude-opus-5-5';

function identifyScooter(photos) {
  const key = PropertiesService.getScriptProperties().getProperty('ANTHROPIC_API_KEY');
  if (!key) throw new Error('AI scan is not switched on yet. In Apps Script open Project Settings > Script properties and add ANTHROPIC_API_KEY (see README).');
  photos = (photos || []).filter(p => p && p.data).slice(0, 2);
  if (!photos.length) throw new Error('Take a photo of the scooter first.');

  const models = readTable_('Models').filter(m => String(m.Active).toUpperCase() !== 'NO');
  const names = [];
  models.forEach(m => { const n = str_(m.Model); if (n && names.indexOf(n) < 0) names.push(n); });
  if (!names.length) throw new Error('Add models first (Models tab, or the sheet menu Master EV > Load Zelio models).');
  const choices = names.concat(['UNKNOWN']);

  const content = [];
  photos.forEach(p => {
    content.push({ type: 'image', source: { type: 'base64', media_type: p.mediaType || 'image/jpeg', data: String(p.data).replace(/^data:[^,]+,/, '') } });
  });
  content.push({ type: 'text', text:
    'You are helping an electric scooter showroom add one scooter to its stock list.\n' +
    'Photo 1 shows the scooter.' + (photos.length > 1 ? ' Photo 2 shows a number plate or sticker on the same scooter.' : '') + '\n\n' +
    'Pick the model from this list only (these are the models the showroom sells): ' + names.join(', ') + '.\n' +
    'Several of them look alike (for example the Gracy, Eeva, Legender and X Men families). Give your best match, ' +
    'say how sure you are, and list close look-alikes as alternatives. If the photo does not show a scooter from this list, answer UNKNOWN.\n' +
    'Give the main body colour in plain words (for example White, Charcoal Black, Crimson Red).\n' +
    'Copy the chassis/VIN, motor, battery and charger numbers exactly as printed, but only when you can read every character clearly. ' +
    'If a number is not visible or any character is unclear, return an empty string for it. Never guess characters.\n' +
    'In notes, say in one short sentence anything the staff should check by eye.' });

  const schema = {
    type: 'object', additionalProperties: false,
    required: ['model', 'confidence', 'alternatives', 'color', 'chassisNo', 'motorNo', 'batteryNo', 'chargerNo', 'notes'],
    properties: {
      model: { type: 'string', enum: choices },
      confidence: { type: 'string', enum: ['high', 'medium', 'low'] },
      alternatives: { type: 'array', items: { type: 'string', enum: choices } },
      color: { type: 'string' }, chassisNo: { type: 'string' }, motorNo: { type: 'string' },
      batteryNo: { type: 'string' }, chargerNo: { type: 'string' }, notes: { type: 'string' }
    }
  };

  const res = UrlFetchApp.fetch('https://api.anthropic.com/v1/messages', {
    method: 'post', contentType: 'application/json', muteHttpExceptions: true,
    headers: { 'x-api-key': key, 'anthropic-version': '2026-10-21', 'anthropic-beta': 'server-side-fallback-2026-07-01' },
    payload: JSON.stringify({
      model: AI_MODEL, max_tokens: 16000, fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: schema } },
      messages: [{ role: 'user', content: content }]
    })
  });
  const code = res.getResponseCode();
  let body = {};
  try { body = JSON.parse(res.getContentText()); } catch (e) {}
  if (code === 401) throw new Error('The AI key was rejected. Check ANTHROPIC_API_KEY in Script properties.');
  if (code === 429 || code >= 500) throw new Error('The AI service is busy. Please try again in a minute.');
  if (code !== 200) throw new Error('AI scan failed (' + code + '): ' + ((body.error && body.error.message) || 'unknown error'));
  if (body.stop_reason === 'refusal') throw new Error('The AI could not process this photo. Please try another photo.');
  const textBlock = (body.content || []).filter(b => b.type === 'text').pop();
  let out;
  try { out = JSON.parse(textBlock.text); } catch (e) { throw new Error('The AI reply could not be read. Please try again.'); }

  const pick = n => models.filter(m => str_(m.Model) === n).map(m => ({ ModelId: m.ModelId, name: modelName_(m), SalePrice: num_(m.SalePrice) }));
  out.candidates = out.model === 'UNKNOWN' ? [] : pick(out.model);
  out.altCandidates = [];
  (out.alternatives || []).forEach(n => { if (n !== out.model && n !== 'UNKNOWN') out.altCandidates = out.altCandidates.concat(pick(n)); });
  ['chassisNo', 'motorNo', 'batteryNo', 'chargerNo'].forEach(k => { out[k] = str_(out[k]).toUpperCase().replace(/\s+/g, ''); });
  out.duplicate = !!out.chassisNo && readTable_('Stock').some(s => str_(s.ChassisNo).toUpperCase() === out.chassisNo);
  return out;
}

<script>

const STATES = [['01','Jammu and Kashmir'],['02','Himachal Pradesh'],['03','Punjab'],['04','Chandigarh'],['05','Uttarakhand'],['06','Haryana'],['07','Delhi'],['08','Rajasthan'],['09','Uttar Pradesh'],['10','Bihar'],['11','Sikkim'],['12','Arunachal Pradesh'],['13','Nagaland'],['14','Manipur'],['15','Mizoram'],['16','Tripura'],['17','Meghalaya'],['18','Assam'],['19','West Bengal'],['20','Jharkhand'],['21','Odisha'],['22','Chhattisgarh'],['23','Madhya Pradesh'],['24','Gujarat'],['26','Dadra and Nagar Haveli and Daman and Diu'],['27','Maharashtra'],['29','Karnataka'],['30','Goa'],['31','Lakshadweep'],['32','Kerala'],['33','Tamil Nadu'],['34','Puducherry'],['35','Andaman and Nicobar Islands'],['36','Telangana'],['37','Andhra Pradesh'],['38','Ladakh'],['97','Other Territory']];
const PAY_MODES = ['Cash','UPI','Card','Bank Transfer','Cheque','Finance / Loan'];

/* ---------- helpers ---------- */
function call(fn){const args=[].slice.call(arguments,1);return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args);});}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(v){const n=Number(v);return isFinite(n)?n:0;}
function r2(n){return Math.round((n+Number.EPSILON)*100)/100;}
function money(n){return '₹'+num(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(n){return '₹'+Math.round(num(n)).toLocaleString('en-IN');}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){s=String(s||'').slice(0,10);const p=s.split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:s;}
function $(id){return document.getElementById(id);}
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className=err?'err':'';clearTimeout(t._h);t._h=setTimeout(()=>t.className='hide',err?6000:3000);}
function fail(e){busy(false);toast((e&&e.message)||String(e),true);}
function busy(on,msg){$('loading').textContent=msg||'Working...';$('loading').classList.toggle('hide',!on);}
function stateName(code){const s=STATES.find(x=>x[0]===code);return s?s[1]:'';}
function stateOpts(sel){return '<option value="">Select state</option>'+STATES.map(s=>`<option value="${s[0]}"${s[0]===sel?' selected':''}>${s[0]} ${esc(s[1])}</option>`).join('');}
function modelName(m){return [m.Brand,m.Model,m.Variant].filter(Boolean).join(' ');}

function inWords(n){
  n=Math.round(num(n));if(n===0)return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):''):two(x);
  const out=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)out.push(inWords(cr)+' Crore');if(lk)out.push(two(lk)+' Lakh');if(th)out.push(two(th)+' Thousand');if(n)out.push(three(n));
  return out.join(' ');
}

/** Same maths as calc_() in Code.gs. */
function calc(items,billType,inclusive,interState){
  const t={taxable:0,cgst:0,sgst:0,igst:0,lines:[]};
  items.forEach(it=>{
    const qty=num(it.qty),price=num(it.unitPrice),gross=r2(qty*price);
    const rate=billType==='GST'?num(it.gstRate):0;
    const taxable=rate&&inclusive?r2(gross/(1+rate/100)):gross;
    const tax=r2(taxable*rate/100);
    let c=0,s=0,i=0;if(interState)i=tax;else{c=r2(tax/2);s=r2(tax-c);}
    t.lines.push({taxable,cgst:c,sgst:s,igst:i,lineTotal:r2(taxable+tax)});
    t.taxable+=taxable;t.cgst+=c;t.sgst+=s;t.igst+=i;
  });
  ['taxable','cgst','sgst','igst'].forEach(k=>t[k]=r2(t[k]));
  const exact=r2(t.taxable+t.cgst+t.sgst+t.igst);t.total=Math.round(exact);t.roundOff=r2(t.total-exact);
  return t;
}

/* ---------- billing ---------- */
function blankBill(type){return {billType:type,date:today(),customer:{name:'',phone:'',address:'',gstin:'',stateCode:S.settings.StateCode||''},items:[],pricesIncludeGST:(S.settings.PricesIncludeGST||'YES').toUpperCase()!=='NO',paymentMode:'Cash',amountPaid:'',notes:''};}
function newBill(type){bill=blankBill(type);go('bill');}
function renderBill(){
  if(!bill)bill=blankBill('GST');
  const g=bill.billType==='GST';const c=bill.customer;
  const used=bill.items.filter(i=>i.itemType==='VEHICLE').map(i=>i.refId);
  const avail=S.stock.filter(v=>v.Status==='In Stock'&&used.indexOf(v.StockId)<0);
  const acc=S.accessories.filter(a=>num(a.Qty)>0);
  $('main').innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">New bill</h2>
    <div class="seg"><button class="${g?'on':''}" onclick="setType('GST')">GST BILL</button><button class="${!g?'on':''}" onclick="setType('NORMAL')">NORMAL BILL</button></div></div>
  <div class="card"><div class="form">

    <div><label>Customer name *</label><input id="cName" value="${esc(c.name)}" oninput="bill.customer.name=this.value"></div>

    ${g?`<div><label>Customer GSTIN (business buyers only)</label><input id="cGstin" value="${esc(c.gstin)}" oninput="onGstin(this.value)" style="text-transform:uppercase"></div>
    <div><label>Place of supply (state)</label><select id="cState" onchange="bill.customer.stateCode=this.value;renderTotals()">${stateOpts(c.stateCode)}</select></div>`:''}
  </div></div>
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <div style="flex:1 1 260px"><label>Add a vehicle from stock</label><select id="addVeh"><option value="">${avail.length?'Pick by model / chassis':'No vehicles in stock'}</option>${avail.map(v=>`<option value="${esc(v.StockId)}">${esc(v.ModelName)} ${v.Color?'('+esc(v.Color)+')':''} | Ch ${esc(v.ChassisNo)}</option>`).join('')}</select></div>

    </div>

    ${g?`<label style="display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink)"><input type="checkbox" style="width:auto" ${bill.pricesIncludeGST?'checked':''} onchange="bill.pricesIncludeGST=this.checked;renderLines()"> Prices entered include GST</label>`:''}

function confirmClear(){return !bill.items.length||window.confirm('Clear this bill?');}
function setType(t){bill.billType=t;renderBill();}
function onGstin(v){v=v.toUpperCase().trim();bill.customer.gstin=v;const code=v.slice(0,2);if(/^\d\d$/.test(code)&&stateName(code)){bill.customer.stateCode=code;const s=$('cState');if(s)s.value=code;renderTotals();}}
function lookupCustomer(){
  const p=bill.customer.phone;if(!p)return;
  call('findCustomer',p).then(c=>{if(!c)return;const b=bill.customer;
    b.name=b.name||c.Name;b.address=b.address||c.Address;b.gstin=b.gstin||c.GSTIN;if(c.StateCode)b.stateCode=String(c.StateCode).padStart(2,'0');
    renderBill();toast('Returning customer: '+c.Name);}).catch(fail);
}
function addVehicleLine(){
  const id=$('addVeh').value;if(!id)return toast('Pick a vehicle first',true);
  bill.items.push(vehicleItem(id));
  renderBill();
}
function scanToBill(code){
  const used=bill.items.filter(i=>i.itemType==='VEHICLE').map(i=>i.refId);
  const hits=findStock(code);
  const ok=hits.filter(v=>v.Status==='In Stock'&&used.indexOf(v.StockId)<0);
  if(ok.length===1){bill.items.push(vehicleItem(ok[0].StockId));renderBill();return toast('Added '+ok[0].ModelName);}
  if(!hits.length)return toast('No vehicle found for '+code,true);
  if(ok.length>1)return toast('More than one vehicle matches '+code+'. Pick it from the list.',true);
  toast(used.indexOf(hits[0].StockId)>=0?'That vehicle is already on this bill':'That vehicle is already sold ('+hits[0].SoldInvoiceNo+')',true);
}
function vehicleItem(id){
  const v=S.stock.find(x=>x.StockId===id);const m=S.models.find(x=>x.ModelId===v.ModelId)||{};
  return {itemType:'VEHICLE',refId:id,description:v.ModelName+(v.Color?' - '+v.Color:''),chassisNo:v.ChassisNo,motorNo:v.MotorNo,batteryNo:v.BatteryNo,chargerNo:v.ChargerNo,
    hsn:m.HSN||S.settings.DefaultVehicleHSN||'8711',qty:1,unitPrice:num(m.SalePrice),gstRate:m.GSTRate!==''&&m.GSTRate!=null?num(m.GSTRate):num(S.settings.DefaultVehicleGSTRate||5)};
}
function addAccLine(){
  const id=$('addAcc').value;if(!id)return toast('Pick an item first',true);
  const a=S.accessories.find(x=>x.ItemId===id);
  bill.items.push({itemType:'ACCESSORY',refId:id,description:a.Name,hsn:a.HSN,qty:1,unitPrice:num(a.SalePrice),gstRate:num(a.GSTRate)});
  renderLines();
}
function addOtherLine(){bill.items.push({itemType:'OTHER',refId:'',description:'',hsn:'',qty:1,unitPrice:0,gstRate:0});renderLines();}
function removeLine(i){bill.items.splice(i,1);renderBill();}
function setLine(i,k,v){bill.items[i][k]=v;renderTotals();}
function renderLines(){
  const g=bill.billType==='GST';
  if(!bill.items.length){$('lines').innerHTML='<tr><td class="muted">No items yet. Add a vehicle, an accessory or an other line (for example registration or insurance charges).</td></tr>';renderTotals();return;}
  $('lines').innerHTML=`<tr><th>#</th><th>Description</th>${g?'<th>HSN</th>':''}<th class="n">Qty</th><th class="n">Price (${g&&bill.pricesIncludeGST?'incl. GST':g?'excl. GST':'each'})</th>${g?'<th class="n">GST %</th><th class="n">Taxable</th><th class="n">GST</th>':''}<th class="n">Amount</th><th></th></tr>`+
  bill.items.map((it,i)=>`<tr><td>${i+1}</td>
    <td style="min-width:200px"><input value="${esc(it.description)}" oninput="setLine(${i},'description',this.value)">${it.itemType==='VEHICLE'?`<div class="small muted">Chassis ${esc(it.chassisNo)} | Motor ${esc(it.motorNo)} | Battery ${esc(it.batteryNo)}</div>`:''}</td>
    ${g?`<td style="width:90px"><input value="${esc(it.hsn)}" oninput="setLine(${i},'hsn',this.value)"></td>`:''}
    <td style="width:70px"><input type="number" min="1" value="${esc(it.qty)}" ${it.itemType==='VEHICLE'?'disabled':''} oninput="setLine(${i},'qty',this.value)"></td>
    <td style="width:130px"><input type="number" min="0" step="0.01" value="${esc(it.unitPrice)}" oninput="setLine(${i},'unitPrice',this.value)"></td>
    ${g?`<td style="width:80px"><select onchange="setLine(${i},'gstRate',this.value)">${[0,5,12,18,28].map(r=>`<option${num(it.gstRate)===r?' selected':''}>${r}</option>`).join('')}</select></td><td class="n" id="tx${i}"></td><td class="n" id="gs${i}"></td>`:''}
    <td class="n" id="lt${i}"></td><td><button class="btn red sm" onclick="removeLine(${i})">x</button></td></tr>`).join('');
  renderTotals();
}
function interState(){const c=bill.customer.stateCode,s=S.settings.StateCode;return bill.billType==='GST'&&!!c&&!!s&&c!==s;}
function renderTotals(){
  const g=bill.billType==='GST';const inter=interState();
  const t=calc(bill.items,bill.billType,bill.pricesIncludeGST,inter);
  t.lines.forEach((l,i)=>{if($('lt'+i))$('lt'+i).textContent=money(l.lineTotal);if($('tx'+i))$('tx'+i).textContent=money(l.taxable);if($('gs'+i))$('gs'+i).textContent=money(l.cgst+l.sgst+l.igst);});
  const paid=bill.amountPaid===''?t.total:num(bill.amountPaid);
  $('totals').innerHTML=(g?`<div><span>Taxable value</span><span>${money(t.taxable)}</span></div>`+(inter?`<div><span>IGST</span><span>${money(t.igst)}</span></div>`:`<div><span>CGST</span><span>${money(t.cgst)}</span></div><div><span>SGST</span><span>${money(t.sgst)}</span></div>`)+
    `<div class="small muted"><span>${inter?'Inter-state sale: IGST applies':'Same-state sale: CGST + SGST'}</span></div>`:'')+
    `<div><span>Round off</span><span>${money(t.roundOff)}</span></div><div class="big"><span>Total</span><span>${money(t.total)}</span></div>`+
    (paid!==t.total?`<div><span>Received</span><span>${money(paid)}</span></div><div style="color:var(--red);font-weight:700"><span>Balance due</span><span>${money(t.total-paid)}</span></div>`:'');
}
function saveBill(){
  if(!bill.customer.name.trim())return toast('Enter the customer name',true);
  if(!bill.items.length)return toast('Add at least one item',true);
  if(bill.items.some(i=>!String(i.description).trim()))return toast('Every line needs a description',true);
  if(bill.billType==='GST'&&!S.settings.GSTIN)return toast('Add your shop GSTIN in Settings first',true);
  const payload=JSON.parse(JSON.stringify(bill));payload.customer.state=stateName(payload.customer.stateCode);
  busy(true,'Saving bill...');
  call('createInvoice',payload).then(r=>{bill=null;toast('Saved '+r.invoice.InvoiceNo);showInvoice(r);return reload();}).catch(fail);
}

/* ---------- invoice view ---------- */
function openInvoice(no){busy(true,'Opening bill...');call('getInvoice',no).then(r=>{busy(false);showInvoice(r);}).catch(fail);}
function showInvoice(r){
  $('printArea').innerHTML=invoiceHtml(r);
  const inv=r.invoice;const active=inv.Status!=='Cancelled';
  $('modalActions').innerHTML=active?`${num(inv.Balance)>0?`<button class="btn" onclick="payInvoice('${esc(inv.InvoiceNo)}',${num(inv.Balance)})">Record payment</button> `:''}<button class="btn red" onclick="cancelInv('${esc(inv.InvoiceNo)}')">Cancel bill</button>`:'';
  $('modal').classList.remove('hide');$('modal').scrollTop=0;
}
function invoiceHtml(r){
  const inv=r.invoice,items=r.items,s=r.settings;const g=inv.BillType==='GST';const inter=num(inv.IGST)>0;
  const head=`<div class="ih"><div><div class="shop">${esc(s.ShopName)}</div>${s.Tagline?`<div>${esc(s.Tagline)}</div>`:''}<div>${esc(s.Address)}</div>
    <div>${s.Phone?'Ph: '+esc(s.Phone):''}${s.Email?' | '+esc(s.Email):''}</div>${g?`<div><b>GSTIN: ${esc(s.GSTIN)}</b> | State: ${esc(s.State)} (${esc(s.StateCode)})</div>`:''}</div>
    <div style="text-align:right"><div><b>${g?'Invoice':'Bill'} No:</b> ${esc(inv.InvoiceNo)}</div><div><b>Date:</b> ${fmtDate(inv.Date)}</div>${g?`<div><b>Place of supply:</b> ${esc(inv.PlaceOfSupply)} (${esc(inv.StateCode)})</div><div>Reverse charge: No</div>`:''}</div></div>`;
  const parties=`<div class="parties"><div><b>Bill to</b><div style="font-size:14px;font-weight:700">${esc(inv.CustomerName)}</div><div>${esc(inv.Address)}</div>${inv.Phone?`<div>Ph: ${esc(inv.Phone)}</div>`:''}${g&&inv.CustomerGSTIN?`<div><b>GSTIN: ${esc(inv.CustomerGSTIN)}</b></div>`:''}</div>
    <div><b>Payment</b><div>Mode: ${esc(inv.PaymentMode)}</div><div>Received: ${money(inv.AmountPaid)}</div>${num(inv.Balance)>0?`<div><b>Balance due: ${money(inv.Balance)}</b></div>`:''}${inv.Notes?`<div class="sub">${esc(inv.Notes)}</div>`:''}</div></div>`;
  const desc=it=>`<b>${esc(it.Description)}</b>${it.ChassisNo?`<div class="sub">Chassis No: ${esc(it.ChassisNo)}<br>Motor No: ${esc(it.MotorNo)}${it.BatteryNo?'<br>Battery No: '+esc(it.BatteryNo):''}</div>`:''}`;
  let table;
  if(g){
    table=`<table><tr><th>#</th><th>Description</th><th>HSN</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Taxable</th><th class="n">GST %</th>${inter?'<th class="n">IGST</th>':'<th class="n">CGST</th><th class="n">SGST</th>'}<th class="n">Total</th></tr>`+
      items.map(it=>`<tr><td>${it.Line}</td><td>${desc(it)}</td><td>${esc(it.HSN)}</td><td class="n">${num(it.Qty)}</td><td class="n">${money(num(it.Taxable)/(num(it.Qty)||1))}</td><td class="n">${money(it.Taxable)}</td><td class="n">${num(it.GSTRate)}%</td>${inter?`<td class="n">${money(it.IGST)}</td>`:`<td class="n">${money(it.CGST)}</td><td class="n">${money(it.SGST)}</td>`}<td class="n">${money(it.LineTotal)}</td></tr>`).join('')+
      `<tr><td colspan="5" class="n"><b>Total</b></td><td class="n"><b>${money(inv.Taxable)}</b></td><td></td>${inter?`<td class="n"><b>${money(inv.IGST)}</b></td>`:`<td class="n"><b>${money(inv.CGST)}</b></td><td class="n"><b>${money(inv.SGST)}</b></td>`}<td class="n"><b>${money(num(inv.Total)-num(inv.RoundOff))}</b></td></tr></table>`;
    const byRate={};items.forEach(it=>{const k=num(it.GSTRate);const b=byRate[k]||(byRate[k]={tx:0,c:0,s:0,i:0});b.tx+=num(it.Taxable);b.c+=num(it.CGST);b.s+=num(it.SGST);b.i+=num(it.IGST);});
    table+=`<table style="margin-top:-1px"><tr><th>GST rate</th><th class="n">Taxable</th>${inter?'<th class="n">IGST</th>':'<th class="n">CGST</th><th class="n">SGST</th>'}<th class="n">Total tax</th></tr>`+
      Object.keys(byRate).sort((a,b)=>a-b).map(k=>{const b=byRate[k];return `<tr><td>${k}%</td><td class="n">${money(b.tx)}</td>${inter?`<td class="n">${money(b.i)}</td>`:`<td class="n">${money(b.c)} (${k/2}%)</td><td class="n">${money(b.s)} (${k/2}%)</td>`}<td class="n">${money(b.c+b.s+b.i)}</td></tr>`;}).join('')+'</table>';
  }else{
    table=`<table><tr><th>#</th><th>Description</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>`+
      items.map(it=>`<tr><td>${it.Line}</td><td>${desc(it)}</td><td class="n">${num(it.Qty)}</td><td class="n">${money(it.UnitPrice)}</td><td class="n">${money(it.LineTotal)}</td></tr>`).join('')+'</table>';
  }
  const foot=`<div class="foot"><div><b>Amount in words:</b><div>Rupees ${inWords(inv.Total)} Only</div>${s.BankDetails?`<div style="margin-top:8px"><b>Bank details:</b> ${esc(s.BankDetails)}</div>`:''}${s.Terms?`<div class="sub" style="margin-top:8px"><b>Terms:</b> ${esc(s.Terms)}</div>`:''}</div>
    <div>${g?`<div style="display:flex;justify-content:space-between"><span>Taxable value</span><span>${money(inv.Taxable)}</span></div><div style="display:flex;justify-content:space-between"><span>Total GST</span><span>${money(num(inv.CGST)+num(inv.SGST)+num(inv.IGST))}</span></div>`:''}
    <div style="display:flex;justify-content:space-between"><span>Round off</span><span>${money(inv.RoundOff)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800;border-top:1px solid #000;margin-top:4px;padding-top:4px"><span>Grand total</span><span>${money(inv.Total)}</span></div></div></div>`;
  const sign=`<div class="sign"><div>Customer signature</div><div style="text-align:right">For <b>${esc(s.ShopName)}</b><br><br>Authorised signatory</div></div>`;
  return `<div class="inv">${head}<div class="title">${g?'TAX INVOICE':'BILL'}</div>${inv.Status==='Cancelled'?'<div class="cxmark">CANCELLED</div>':''}${parties}${table}${foot}${sign}</div>`;
}
function payInvoice(no,bal){
  const amt=window.prompt('Amount received now (balance '+money(bal)+'):',bal);if(amt===null)return;
  const mode=window.prompt('Payment mode (Cash, UPI, Card, Bank Transfer, Cheque):','Cash');if(mode===null)return;
  busy(true,'Saving payment...');call('recordPayment',no,amt,mode).then(r=>{showInvoice(r);toast('Payment saved');return reload();}).catch(fail);
}
function cancelInv(no){
  const why=window.prompt('Cancel bill '+no+'? Vehicles and items on it go back into stock.\n\nReason:');if(why===null)return;
  busy(true,'Cancelling...');call('cancelInvoice',no,why).then(r=>{showInvoice(r);toast('Bill cancelled, stock returned');return reload();}).catch(fail);
}

/* ---------- scanner ---------- */
let scanCb=null,qr=null;
function openScanner(cb){
  scanCb=cb;$('scanManual').value='';$('scanModal').classList.remove('hide');
  if(!window.Html5Qrcode){$('scanMsg').textContent='The camera scanner could not load. Take a photo of the code or type the number.';return;}
  $('scanMsg').textContent='Starting camera...';
  qr=new Html5Qrcode('reader',{experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  qr.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(w*0.9,380)),height:Math.floor(Math.min(h*0.6,220))})},t=>scanDone(t),()=>{})
    .then(()=>{$('scanMsg').textContent='Point the camera at the barcode or QR code and hold still.';})
    .catch(()=>{qr=null;$('scanMsg').textContent='The live camera is not available here. Use "Take a photo of the code" instead, or type the number.';});
}
function stopCam(){const q=qr;qr=null;return q?q.stop().then(()=>q.clear()).catch(()=>{}):Promise.resolve();}
function closeScanner(){scanCb=null;stopCam();$('scanModal').classList.add('hide');$('scanMsg').textContent='';}
function scanDone(text){
  text=String(text||'').trim();if(!text||!scanCb)return;
  const cb=scanCb;closeScanner();
  try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}
  cb(text);
}
function scanPhoto(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  if(!window.Html5Qrcode)return toast('The scanner could not load. Type the number instead.',true);
  $('scanMsg').textContent='Reading the photo...';
  stopCam().then(()=>{const q=new Html5Qrcode('reader',{experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
    return q.scanFile(f,false).then(t=>{q.clear();scanDone(t);});})
    .catch(()=>{$('scanMsg').textContent='No code found in that photo. Try again closer, in good light, with the code flat and sharp.';});
}
function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
const CODE_FIELDS=[['ChassisNo','Chassis'],['MotorNo','Motor'],['BatteryNo','Battery'],['ChargerNo','Charger']];
/** Vehicles whose chassis, motor, battery or charger number matches a scanned code. */
function findStock(code){
  const c=norm(code);if(!c)return [];
  let hits=S.stock.filter(v=>CODE_FIELDS.some(([k])=>norm(v[k])===c));
  if(!hits.length&&c.length>=6)hits=S.stock.filter(v=>CODE_FIELDS.some(([k])=>{const x=norm(v[k]);return x.length>=6&&(c.indexOf(x)>=0||x.indexOf(c)>=0);}));
  return hits;
}
function matchedField(v,code){const c=norm(code);const f=CODE_FIELDS.find(([k])=>norm(v[k])===c)||CODE_FIELDS.find(([k])=>{const x=norm(v[k]);return x&&(c.indexOf(x)>=0||x.indexOf(c)>=0);});return f?f[1]:'';}

let scanMode='ai',scanFound=null;
let ai={scooter:'',plate:'',result:null};
const AUDIT_KEY='masterev-stockcheck';
let audit=(()=>{try{return JSON.parse(localStorage.getItem(AUDIT_KEY))||null;}catch(e){return null;}})()||{started:'',scans:[]};
function saveAudit(){try{localStorage.setItem(AUDIT_KEY,JSON.stringify(audit));}catch(e){}}

function renderScan(){
  const find=scanMode==='find';
  const seg=`<div class="seg"><button class="${scanMode==='ai'?'on':''}" onclick="scanMode='ai';renderScan()">SCAN SCOOTER</button><button class="${find?'on':''}" onclick="scanMode='find';renderScan()">FIND BY NUMBER</button><button class="${scanMode==='audit'?'on':''}" onclick="scanMode='audit';renderScan()">STOCK CHECK</button></div>`;
  if(scanMode==='ai'){$('main').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">Scanner</h2>${seg}</div><div id="aiOut"></div>`;return renderAi();}
  $('main').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">Scanner</h2>
    ${seg}</div>
  <div class="card"><p class="small muted" style="margin-top:0">${find?'Scan the chassis, motor, battery or charger number to see that scooter.':'Walk the showroom and scan every scooter. The list below shows what is missing and what is not in the system.'}</p>
    <div class="row" style="flex-wrap:nowrap"><input id="scanIn" placeholder="Scan with a barcode gun, or type a number and press Enter" style="flex:1 1 auto;min-width:0" onkeydown="if(event.key==='Enter'){handleScan(this.value);}">
    <button class="btn lime" onclick="openScanner(handleScan)">Scan with camera</button></div></div>
  <div id="scanOut"></div>`;
  find?renderFind():renderAudit();
  const i=$('scanIn');if(i&&window.matchMedia('(pointer:fine)').matches)i.focus();
}
function handleScan(code){
  code=String(code||'').trim();if($('scanIn'))$('scanIn').value='';if(!code)return;
  if(scanMode==='find'){scanFound={code,hits:findStock(code)};renderFind();}else auditScan(code);
  const i=$('scanIn');if(i&&window.matchMedia('(pointer:fine)').matches)i.focus();
}
function renderFind(){
  const out=$('scanOut');if(!out)return;
  if(!scanFound){out.innerHTML='';return;}
  const {code,hits}=scanFound;
  if(!hits.length){out.innerHTML=`<div class="card" style="border-color:var(--amber)"><b>No vehicle found for ${esc(code)}</b><p class="small muted">It is not in stock and was never sold from this system.</p>
    <button class="btn lime" onclick="vehPrefill={ChassisNo:'${esc(code.toUpperCase().replace(/[^A-Z0-9\-\/]/g,''))}'};go('vehicles')">Add a new vehicle with this chassis no.</button></div>`;return;}
  out.innerHTML=hits.map(v=>{const sold=v.Status!=='In Stock';return `<div class="card" style="border:2px solid ${sold?'#999':'var(--green)'}">
    <div class="row" style="justify-content:space-between;align-items:center"><div style="font-size:18px;font-weight:800">${esc(v.ModelName)}</div>${sold?'<span class="pill p-sold">Sold</span>':'<span class="pill p-in">In stock</span>'}</div>
    <div class="small muted">Matched on ${esc(matchedField(v,code))} number ${esc(code)}</div>
    <table class="tbl" style="margin-top:8px"><tr><td>Colour</td><td>${esc(v.Color)||'-'}</td></tr><tr><td>Chassis</td><td><b>${esc(v.ChassisNo)}</b></td></tr><tr><td>Motor</td><td>${esc(v.MotorNo)||'-'}</td></tr><tr><td>Battery</td><td>${esc(v.BatteryNo)||'-'}</td></tr><tr><td>Charger</td><td>${esc(v.ChargerNo)||'-'}</td></tr>
    <tr><td>Purchased</td><td>${fmtDate(v.PurchaseDate)} ${v.Supplier?'from '+esc(v.Supplier):''}</td></tr>${sold?`<tr><td>Sold</td><td>${fmtDate(v.SoldDate)}, bill <a href="#" onclick="openInvoice('${esc(v.SoldInvoiceNo)}');return false">${esc(v.SoldInvoiceNo)}</a></td></tr>`:''}</table>
    ${sold?'':`<div class="row" style="margin-top:10px"><button class="btn lime" onclick="billFromScan('${esc(v.StockId)}','GST')">Make GST bill</button><button class="btn" onclick="billFromScan('${esc(v.StockId)}','NORMAL')">Make normal bill</button></div>`}</div>`;}).join('');
}
/* AI scan: photo of the scooter (+ plate) -> model, colour, numbers -> mark as stock */
function shrinkPhoto(file){
  return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,1568/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read that photo. Try again.'));};img.src=url;});
}
function aiPhoto(inp,which){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  shrinkPhoto(f).then(d=>{ai[which]=d;ai.result=null;renderAi();}).catch(fail);}
function photoBox(which,title,hint){
  const d=ai[which];
  return `<div class="card" style="flex:1 1 260px;margin:0"><b>${title}</b><p class="small muted" style="margin:4px 0 10px">${hint}</p>
    ${d?`<img src="${d}" alt="" style="width:100%;max-height:220px;object-fit:contain;background:#111;border-radius:8px">`:''}
    <label class="btn ${d?'ghost':'lime'}" style="display:inline-block;margin-top:8px;font-size:14px;color:var(--ink)">${d?'Retake':'Take photo'}<input type="file" accept="image/*" capture="environment" class="hide" onchange="aiPhoto(this,'${which}')"></label>
    ${d?`<button class="btn ghost sm" style="margin-left:6px" onclick="ai['${which}']='';ai.result=null;renderAi()">Remove</button>`:''}</div>`;
}
function renderAi(){
  const out=$('aiOut');if(!out)return;const r=ai.result;
  out.innerHTML=`<div class="row" style="align-items:stretch;gap:12px;margin-bottom:12px">
    ${photoBox('scooter','1. Photo of the scooter','Side view, whole scooter in the frame, good light.')}
    ${photoBox('plate','2. Photo of the chassis number (recommended)','Close-up of the chassis plate or sticker so the AI can read the number.')}</div>
  <div class="row" style="margin-bottom:16px"><button class="btn lime" ${ai.scooter?'':'disabled'} onclick="runAi()">Identify scooter</button>
    <span class="small muted" style="align-self:center">The AI suggests, you confirm. Nothing is saved until you tap Mark as stock.</span></div>
  ${r?aiResultHtml(r):''}`;
}
function runAi(){
  if(!ai.scooter)return toast('Take a photo of the scooter first',true);
  const photos=[ai.scooter,ai.plate].filter(Boolean).map(d=>({data:d,mediaType:'image/jpeg'}));
  busy(true,'AI is looking at the photos...');
  call('identifyScooter',photos).then(r=>{busy(false);ai.result=r;renderAi();
    if(r.model==='UNKNOWN')toast('The AI could not match this to a model. Pick it yourself below.',true);})
    .catch(e=>{const m=(e&&e.message)||String(e);
      if(/not switched on|not available in the demo/i.test(m))return runFreeScan();
      fail(e);});
}

/* Free scan (no AI key): the chassis number is read on the phone with Tesseract,
   and staff tap the model's picture. Used automatically when AI scan is off. */
const IMG_BASE='https://im-mohua-liza.github.io/master-ev-system/img/';
const MODEL_IMG={'Gracy':'gracy','Mystery':'mystery','X Men 2.0':'xmen2','LOGIX':'logix','Logix Loader':'logix-loader','X Men+':'xmen-plus',
  'Legender+ Premium':'legender-plus-premium','Legender+':'legender-plus','Legender':'legender','Gracy Pro':'gracy-pro','Gracy+':'gracy-plus',
  'Gracyi':'gracyi','Little Gracy':'little-gracy','Eeva Eco ZX':'eeva-eco-zx','Eeva Eco LX':'eeva-eco-lx','Eeva Eco':'eeva-eco',
  'EEVA ZX+':'eeva-zx-plus','EEVA (N)':'eeva-n','EEVA ZX':'eeva-zx'};
function loadOcr(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload=()=>res();s.onerror=()=>rej(new Error('The number reader could not load.'));document.head.appendChild(s);});
}
/** Best chassis-like token from OCR text: long, letters and digits mixed. */
function pickChassis(text){
  const toks=String(text||'').toUpperCase().replace(/[^A-Z0-9\s]/g,' ').split(/\s+/).filter(t=>t.length>=8&&/\d/.test(t)&&/[A-Z]/.test(t));
  toks.sort((a,b)=>Math.abs(17-a.length)-Math.abs(17-b.length));
  return toks[0]||'';
}
function freeResult(chassis){
  const dup=!!chassis&&S.stock.some(s=>norm(s.ChassisNo)===norm(chassis));
  return {free:true,model:'UNKNOWN',confidence:'',alternatives:[],color:'',chassisNo:chassis,motorNo:'',batteryNo:'',chargerNo:'',notes:'',candidates:[],altCandidates:[],duplicate:dup};
}
function runFreeScan(){
  const img=ai.plate||ai.scooter;
  busy(true,'Reading the chassis number on this phone...');
  loadOcr().then(()=>Tesseract.recognize(img,'eng')).then(o=>{busy(false);ai.result=freeResult(pickChassis(o.data&&o.data.text));renderAi();})
    .catch(()=>{busy(false);ai.result=freeResult('');renderAi();toast('Could not read the number. Type it in.',true);});
}
function pickModel(name){
  const r=ai.result;if(!r)return;r.model=name;
  r.candidates=S.models.filter(m=>m.Model===name&&String(m.Active).toUpperCase()!=='NO').map(m=>({ModelId:m.ModelId,name:modelName(m),SalePrice:m.SalePrice}));
  renderAi();
  const sel=document.querySelector('#aiform select[name=ModelId]');if(sel&&r.candidates.length===1)sel.value=r.candidates[0].ModelId;
  const f=$('aiform');if(f)f.scrollIntoView({behavior:'smooth',block:'start'});
}
function modelGrid(r){
  const names=[];S.models.forEach(m=>{if(String(m.Active).toUpperCase()!=='NO'&&names.indexOf(m.Model)<0)names.push(m.Model);});
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0">${names.map(n=>{const k=MODEL_IMG[n];const on=r.model===n;
    return `<button onclick="pickModel('${esc(n).replace(/'/g,'&#39;')}')" style="border:${on?'3px solid var(--ink)':'1px solid var(--line)'};background:${on?'var(--lime)':'#fff'};border-radius:8px;padding:6px;cursor:pointer;font:inherit;font-size:12px;font-weight:700">
      ${k?`<img src="${IMG_BASE}${k}.webp" alt="" loading="lazy" style="width:100%;height:80px;object-fit:contain">`:'<div style="height:80px"></div>'}<div>${esc(n)}</div></button>`;}).join('')}</div>`;
}
function aiResultHtml(r){
  const opts=(list,label)=>list.length?`<optgroup label="${esc(label)}">${list.map(c=>`<option value="${esc(c.ModelId)}">${esc(c.name)} | ${money0(c.SalePrice)}</option>`).join('')}</optgroup>`:'';
  const shown={};r.candidates.concat(r.altCandidates).forEach(c=>shown[c.ModelId]=1);
  const rest=S.models.filter(m=>String(m.Active).toUpperCase()!=='NO'&&!shown[m.ModelId]).map(m=>({ModelId:m.ModelId,name:modelName(m),SalePrice:m.SalePrice}));
  const conf={high:['var(--green)','Sure'],medium:['var(--amber)','Fairly sure'],low:['var(--red)','Not sure']}[r.confidence]||['var(--mute)',''];
  const alts=[...new Set((r.alternatives||[]).filter(a=>a!==r.model&&a!=='UNKNOWN'))];
  const f=(k,l,v)=>`<div><label>${l}</label><input name="${k}" value="${esc(v||'')}" style="text-transform:uppercase"></div>`;
  const head=r.free
    ?`<div style="font-size:18px;font-weight:800">${r.model==='UNKNOWN'?'Tap the scooter\'s picture':'Selected: Zelio '+esc(r.model)}</div>
      <div class="small muted">Free scan: the chassis number was read on this phone. AI model recognition switches on when an AI key is added.</div>${modelGrid(r)}`
    :`<div class="row" style="justify-content:space-between;align-items:center"><div style="font-size:18px;font-weight:800">${r.model==='UNKNOWN'?'Model not recognised':'Looks like: Zelio '+esc(r.model)}</div>
      ${r.model==='UNKNOWN'?'':`<span class="pill" style="background:${conf[0]};color:#fff">${conf[1]}</span>`}</div>`;
  return `<div class="card" style="border:2px solid ${r.free?'var(--ink)':conf[0]}">
    ${head}
    ${alts.length?`<div class="small muted">Could also be: ${esc(alts.join(', '))}</div>`:''}
    ${r.notes?`<div class="small" style="margin-top:4px">${esc(r.notes)}</div>`:''}
    ${r.duplicate?`<div class="card" style="border-color:var(--red);margin:10px 0 0"><b style="color:var(--red)">Chassis ${esc(r.chassisNo)} is already in the system.</b> <a href="#" onclick="scanMode='find';scanFound={code:'${esc(r.chassisNo)}',hits:findStock('${esc(r.chassisNo)}')};renderScan();return false">See it</a></div>`:''}
    <h3>Check and confirm</h3>
    <div class="form" id="aiform">
      <div class="wide"><label>Model and battery variant * (the battery cannot be seen in a photo, so pick it)</label><select name="ModelId"><option value="">Select</option>${opts(r.candidates,r.free?'Selected model':'AI match')}${opts(r.altCandidates,'Look-alikes')}${opts(rest,'All other models')}</select></div>
      <div><label>Colour</label><input name="Color" value="${esc(r.color)}"></div>
      ${f('ChassisNo','Chassis / VIN no. *',r.chassisNo)}${f('MotorNo','Motor no.',r.motorNo)}${f('BatteryNo','Battery no.',r.batteryNo)}${f('ChargerNo','Charger no.',r.chargerNo)}
      <div><label>Supplier</label><input name="Supplier"></div>
      <div><label>Purchase invoice no.</label><input name="PurchaseInvoiceNo"></div>
      <div><label>Purchase date</label><input type="date" name="PurchaseDate" value="${today()}"></div>
      <div><label>Cost price (blank = model cost)</label><input type="number" step="0.01" name="CostPrice"></div>
    </div>
    ${r.chassisNo?'<p class="small muted">The chassis number was read from the photo. Compare it with the plate before saving.</p>':'<p class="small" style="color:var(--amber)">The chassis number could not be read. Type it in, or retake photo 2 closer.</p>'}
    <div class="row" style="margin-top:12px"><button class="btn lime" onclick="aiSave()">Mark as stock</button><button class="btn ghost" onclick="ai={scooter:'',plate:'',result:null};renderAi()">Start over</button></div></div>`;
}
function aiSave(){
  const v=formData('aiform');
  if(!v.ModelId)return toast('Pick the model and battery variant',true);
  if(!v.ChassisNo)return toast('Enter the chassis number',true);
  v.Notes='Added by AI scan';
  busy(true,'Adding to stock...');
  call('addVehicle',v).then(row=>{toast('In stock: '+row.ModelName+' ('+row.ChassisNo+')');ai={scooter:'',plate:'',result:null};return reload();}).catch(fail);
}

function billFromScan(id,type){bill=blankBill(type);bill.items.push(vehicleItem(id));go('bill');}

function auditScan(code){
  const c=norm(code);
  if(audit.scans.some(s=>norm(s.code)===c))return toast(code+' is already counted',true);
  const hits=findStock(code);
  const v=hits.find(h=>h.Status==='In Stock')||hits[0];
  if(v&&audit.scans.some(s=>s.stockId===v.StockId))return toast('This scooter is already counted ('+v.ChassisNo+')',true);
  if(!audit.started)audit.started=new Date().toLocaleString('en-IN');
  audit.scans.push({code,stockId:v?v.StockId:'',time:new Date().toLocaleTimeString('en-IN')});
  saveAudit();
  toast(v?'Counted: '+v.ModelName:'Not in system: '+code,!v);
  renderAudit();
}
function renderAudit(){
  const out=$('scanOut');if(!out)return;
  const inStock=S.stock.filter(v=>v.Status==='In Stock');
  const seen={};audit.scans.forEach(s=>{if(s.stockId)seen[s.stockId]=s;});
  const found=inStock.filter(v=>seen[v.StockId]);
  const missing=inStock.filter(v=>!seen[v.StockId]);
  const soldButHere=S.stock.filter(v=>v.Status!=='In Stock'&&seen[v.StockId]);
  const unknown=audit.scans.filter(s=>!s.stockId);
  const vrow=v=>`<tr><td>${esc(v.ModelName)}</td><td>${esc(v.Color)}</td><td><b>${esc(v.ChassisNo)}</b></td></tr>`;
  out.innerHTML=`<div class="grid">
    <div class="stat"><div class="k">In stock (system)</div><div class="v">${inStock.length}</div></div>
    <div class="stat hl"><div class="k">Found</div><div class="v">${found.length}</div></div>
    <div class="stat"><div class="k">Missing</div><div class="v" style="color:${missing.length?'var(--red)':'var(--green)'}">${missing.length}</div></div>
    <div class="stat"><div class="k">Not in system</div><div class="v" style="color:${unknown.length?'var(--amber)':'inherit'}">${unknown.length}</div></div></div>
  <p class="small muted">${audit.started?'Count started '+esc(audit.started)+'. Saved on this device, so you can close the app and carry on.':'Nothing scanned yet.'}</p>
  ${missing.length?`<div class="card scroll"><h3 style="margin-top:0;color:var(--red)">Missing: in the system but not scanned (${missing.length})</h3><table class="tbl"><tr><th>Model</th><th>Colour</th><th>Chassis</th></tr>${missing.map(vrow).join('')}</table></div>`:(inStock.length?'<div class="card" style="border-color:var(--green)"><b style="color:var(--green)">Every scooter in stock has been found.</b></div>':'')}
  ${unknown.length?`<div class="card scroll"><h3 style="margin-top:0;color:var(--amber)">Scanned but not in the system (${unknown.length})</h3><table class="tbl">${unknown.map(s=>`<tr><td><b>${esc(s.code)}</b></td><td class="small muted">${esc(s.time)}</td><td><button class="btn sm" onclick="vehPrefill={ChassisNo:'${esc(norm(s.code))}'};go('vehicles')">Add to stock</button></td></tr>`).join('')}</table></div>`:''}
  ${soldButHere.length?`<div class="card scroll"><h3 style="margin-top:0;color:var(--amber)">Marked Sold but found in the showroom (${soldButHere.length})</h3><table class="tbl">${soldButHere.map(v=>`<tr><td>${esc(v.ModelName)}</td><td><b>${esc(v.ChassisNo)}</b></td><td>bill ${esc(v.SoldInvoiceNo)}</td></tr>`).join('')}</table></div>`:''}
  ${found.length?`<div class="card scroll"><h3 style="margin-top:0">Found (${found.length})</h3><table class="tbl">${found.map(vrow).join('')}</table></div>`:''}
  <div class="row"><button class="btn ghost" onclick="printAudit()">Print count</button><button class="btn red" onclick="if(window.confirm('Clear this count and start again?')){audit={started:'',scans:[]};saveAudit();renderAudit();}">Start a new count</button></div>`;
}
function printAudit(){$('printArea').innerHTML=`<h2>${esc(S.settings.ShopName)}: stock check ${esc(audit.started)}</h2>`+$('scanOut').innerHTML.replace(/<div class="row">[\s\S]*$/,'');$('modalActions').innerHTML='';$('modal').classList.remove('hide');}

/* ---------- start ---------- */
renderNav();
reload();
</script>
</body>
</html>
